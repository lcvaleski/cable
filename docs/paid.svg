<!-- The "Paid" animation from site/index.html, standalone so the README can show
     it. Change them together. paid-dark.svg is this file with the colours
     swapped for GitHub's dark theme. -->
<svg xmlns="http://www.w3.org/2000/svg" class="diagram paid" viewBox="0 0 440 190" width="440" height="190" role="img"
     aria-label="Instagram is gone from the phone and your Mac can no longer undo it. You ask from the phone, a timer counts down, the password arrives from Cable, you type it in and the app comes back.">
    <style>
        .diagram { color: black; }
        .diagram .cap {
            font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            fill: #333;
            stroke: none;
            text-anchor: middle;
        }

        /* Paid: nobody walks — the motion is the clock, the asking and the reply. */
        .paid .clk       { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
        .paid .brand     { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #111; stroke: none; text-anchor: middle; }
        .paid .hand      { transform-box: view-box; transform-origin: 373px 134px; animation: spin 2.6s linear infinite; }
        .paid .ask       { animation: pAsk 16s linear infinite; }
        .paid .reply     { animation: pReply 16s linear infinite; }
        .paid .ig-back   { animation: pBack 16s linear infinite; }
        .paid .clk1      { animation: pClk1 16s linear infinite; }
        .paid .clk2      { animation: pClk2 16s linear infinite; }
        .paid .clk3      { animation: pClk3 16s linear infinite; }
        .paid .clk4      { animation: pClk4 16s linear infinite; }
        .paid .pcap1     { animation: pCap1 16s linear infinite; }
        .paid .pcap2     { animation: pCap2 16s linear infinite; }
        .paid .pcap3     { animation: pCap3 16s linear infinite; }
        .paid .pcap4     { animation: pCap4 16s linear infinite; }
        .paid .pcap5     { animation: pCap5 16s linear infinite; }

        @keyframes spin   { to { transform: rotate(360deg) } }
        @keyframes pAsk   { 0%,24.99% {opacity:0} 25%,37.4% {opacity:1} 37.5%,100% {opacity:0} }
        @keyframes pReply { 0%,68.74% {opacity:0} 68.75%,78.9% {opacity:1} 79%,100% {opacity:0} }
        @keyframes pBack  { 0%,78.99% {opacity:0} 79%,100% {opacity:1} }
        @keyframes pClk1  { 0%,37.49% {opacity:0} 37.5%,44.9% {opacity:1} 45%,100% {opacity:0} }
        @keyframes pClk2  { 0%,44.99% {opacity:0} 45%,53.9% {opacity:1} 54%,100% {opacity:0} }
        @keyframes pClk3  { 0%,53.99% {opacity:0} 54%,61.9% {opacity:1} 62%,100% {opacity:0} }
        @keyframes pClk4  { 0%,61.99% {opacity:0} 62%,68.6% {opacity:1} 68.7%,100% {opacity:0} }
        @keyframes pCap1  { 0%,22% {opacity:1} 22.01%,100% {opacity:0} }
        @keyframes pCap2  { 0%,24.99% {opacity:0} 25%,37.4% {opacity:1} 37.5%,100% {opacity:0} }
        @keyframes pCap3  { 0%,37.49% {opacity:0} 37.5%,68.6% {opacity:1} 68.7%,100% {opacity:0} }
        @keyframes pCap4  { 0%,68.74% {opacity:0} 68.75%,78.9% {opacity:1} 79%,100% {opacity:0} }
        @keyframes pCap5  { 0%,78.99% {opacity:0} 79%,100% {opacity:1} }

        @media (prefers-reduced-motion: reduce) {
            .paid .hand, .paid .ask, .paid .reply, .paid .ig-back,
            .paid .clk, .paid .cap { animation: none; }
            .paid .ask, .paid .reply, .paid .ig-back, .paid .clk,
            .paid .pcap2, .paid .pcap3, .paid .pcap4, .paid .pcap5 { opacity: 0; }
        }
    </style>
    <defs>
        <radialGradient id="ig2" cx="28%" cy="104%" r="140%">
            <stop offset="0%" stop-color="#fdf497"/>
            <stop offset="8%" stop-color="#fdf497"/>
            <stop offset="38%" stop-color="#fd5949"/>
            <stop offset="58%" stop-color="#d6249f"/>
            <stop offset="92%" stop-color="#285aeb"/>
        </radialGradient>
    </defs>
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

        <!-- The Mac is struck out for good: it can't undo this one. -->
        <path d="M26 152 h388" stroke-dasharray="2 7"/>
        <rect x="34" y="70" width="56" height="36" rx="3"/>
        <path d="M26 112 h72"/>
        <path d="M38 104 L86 74" stroke="#c00" stroke-width="2"/>

        <!-- Us, not "a server": the Cable mark, named, with a clock under it. -->
        <rect x="350" y="54" width="46" height="46" rx="11"/>
        <rect x="367" y="74" width="12" height="16" rx="3"/>
        <path d="M370 74 v-6 M376 74 v-6 M373 90 v9"/>
        <text class="brand" x="373" y="116">Cable</text>
        <circle cx="373" cy="134" r="12"/>
        <g class="hand"><path d="M373 134 V126"/></g>

        <!-- The person never goes back to the Mac. -->
        <circle cx="200" cy="84" r="9"/>
        <path d="M200 93 v27"/>
        <path d="M200 100 l-14 9 M200 100 l16 6"/>
        <path d="M200 120 l-10 26 M200 120 l10 26"/>
        <rect x="212" y="100" width="24" height="40" rx="4"/>
        <path d="M218 134 h12"/>
        <g class="ig-back">
            <rect x="215" y="106" width="18" height="18" rx="5" fill="url(#ig2)" stroke="none"/>
            <rect x="218" y="109" width="12" height="12" rx="3.6" fill="none" stroke="#fff" stroke-width="1.2"/>
            <circle cx="224" cy="115" r="2.9" fill="none" stroke="#fff" stroke-width="1.2"/>
            <circle cx="228.1" cy="110.9" r="0.85" fill="#fff" stroke="none"/>
        </g>

        <!-- Ask, then wait, then the password comes back. -->
        <g class="ask">
            <path d="M242 100 C 280 88, 312 80, 344 76" stroke-dasharray="3 4"/>
            <path d="M336 70 l9 6 l-9 5"/>
        </g>
        <g class="reply">
            <path d="M346 96 C 316 110, 282 118, 250 118" stroke-dasharray="3 4"/>
            <path d="M258 112 l-9 6 l9 5"/>
            <rect x="288" y="126" width="18" height="11" rx="2"/>
            <path d="M292 126 v-3 a5 5 0 0 1 10 0 v3"/>
        </g>

        <text class="clk clk1" x="232" y="50">23:14:52</text>
        <text class="clk clk2" x="232" y="50">11:47:03</text>
        <text class="clk clk3" x="232" y="50">02:22:19</text>
        <text class="clk clk4" x="232" y="50">00:00:07</text>

        <text class="cap pcap1" x="220" y="178">Even your Mac can't undo it</text>
        <text class="cap pcap2" x="220" y="178">Ask, from the phone</text>
        <text class="cap pcap3" x="220" y="178">Wait the delay you chose</text>
        <text class="cap pcap4" x="220" y="178">The password arrives</text>
        <text class="cap pcap5" x="220" y="178">Type it in — it's back</text>
    </g>
</svg>
